# FastBox electron-builder 打包配置（P3 完成版）
#
# 目标形态：跨平台分发包 = Electron 外壳 + 内置 jlink JRE + 便携 Python + 网关 jar + 初始插件
# 完整流程：见 scripts/build-runtime.ps1（jlink JRE + portable venv）+ 本文件（electron-builder 装配）
#
# 关键路径契约（main.js / logger.js 同步实现）：
#   process.resourcesPath/runtime/gateway/fastbox-gateway.jar  — Java 网关 shaded jar
#   process.resourcesPath/runtime/jre17/bin/java(.exe)        — 精简 JRE 入口
#   process.resourcesPath/runtime/python/.venv/Scripts/python.exe + main.py — 便携 Python
#   process.resourcesPath/plugins/{js,python,java}            — 内置插件（用户安装后可扩展）
#   app.getPath('userData')/data                              — SQLite + 日志（Program Files 无写权限）
#
# 打包前置（在执行 npm run dist 前必须完成）：
#   1. ./scripts/build-runtime.ps1            # 生成 jre17 + portable venv
#   2. cd electron && npm install              # 装 electron-builder
#   3. 准备图标：electron/assets/icon.ico     # win 图标（mac/linux 类似）
#   4. （可选）npm run build:runtime          # 步骤 1 的便捷入口

appId: com.fastbox.app
productName: FastBox
copyright: Copyright © 2026 FastBox

directories:
  output: dist
  buildResources: assets

# 只打包 UI 代码进 asar；node_modules 中 electron 为 devDependency 不参与打包
files:
  - src/**/*
  - package.json

# 运行时外部组件：不进 asar，放 resources/ 下（打包后通过 process.resourcesPath 访问）
extraResources:
  # Java 网关 shaded jar（由 mvn package 产出）
  - from: ../java-gateway/target/fastbox-gateway.jar
    to: runtime/gateway/fastbox-gateway.jar
  # 精简 JRE 17（jlink 产物，目标 <projectRoot>/runtime/jre17）
  # 文件大小 <60MB，剔除 debug/man，减少分发包体积
  - from: ../runtime/jre17
    to: runtime/jre17
  # 便携 Python 运行时：解释器 + 依赖 + 内置 Python 插件
  # 注意：开发模式下 .venv 基于 WorkBuddy Python 创建，pyvenv.cfg 含绝对路径
  # 必须用 scripts/build-runtime.ps1 -PyOnly 重建为 portable venv 才能跨机分发
  - from: ../python-runtime
    to: runtime/python
    filter:
      - main.py
      - requirements.txt
      - plugins/**/*
      - .venv/**/*
  # 初始插件目录（js/python/java 三类；打包版安装后用户可自行扩展）
  # python/plugins/ 镜像自 python-runtime/plugins/，方便外部直接 require
  - from: ../plugins
    to: plugins

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FastBox

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility

# 自动更新：electron-updater generic provider
# 自建静态更新服务器（放 latest.yml + 安装包 + blockmap），URL 为占位，部署时替换
# 备选：GitHub Releases（provider: github）——FastBox 暂无公开仓库，故默认自建
publish:
  provider: generic
  url: https://example.com/fastbox/releases

# 版本契约：主版本号整包同步；Java/Python 组件版本内嵌不单独更新
